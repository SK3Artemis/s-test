<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-iconf" href="https://sk3artemis.github.io/b/icon.png">
    <title id="titleText">File Index of /</title>
    <style>
        * {box-sizing: border-box;}
        html, body {margin: 0; width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #181818; color: #eee;}
        button {border: 1px solid #4a4a4a; background: #333; color: #eee;cursor: pointer; font-size: 13px;}
        button:hover {background: #414141;}
        button:disabled {opacity: 0.4; cursor: default;}
        .pathIndex {border: 0; background: transparent; color: #bbb;}
        .pathIndex:hover {color: white; background: #333;}
        .separator {color: #666;}
        .search input:focus {border-color: #777;}
        .type {color: #888; font-size: 12px; padding-left: 20px;}
		.entry {display:grid;grid-template-columns:minmax(0,1fr) 90px 110px;align-items:center;min-height:42px;padding:0 12px;border-bottom:1px solid #2e2e2e;cursor:pointer;user-select:none;}
        .entry:hover {background: #303030;}
        .entry.selected {background: #3b4d63;}
        .loading, .error, .empty {position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #999; padding: 30px; text-align: center;}
        .error {color: #e88;}
        .select-button:hover {background: #4780bd;}
    </style>
</head>
<body>
<div class="browser" style="background: #222; border: 1px solid #444; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);">
    <div class="titlebar" style="height:46px;display:flex;align-items:center;padding:0 15px;background:#2b2b2b;border-bottom:1px solid #444;font-size:13px;font-weight:bold;">
		<span id="status" style="font-size: 13px; font-weight: normal; color: #999;">Connecting....</span>
	</div>
    <div style="display: flex; gap: 6px; padding: 8px; background: #262626; border-bottom: 1px solid #3b3b3b;">
        <button id="backButton" disabled>Back</button>
        <button onclick="loadDir("");">Root</button>
        <button id="refreshButton">Refresh</button>
    </div>
    <div id="pathIndex" style="display: flex; align-items: center; gap: 4px; min-height: 40px; padding: 6px 10px; background: #202020; border-bottom: 1px solid #3b3b3b; overflow-x: auto; white-space: nowrap;"></div>
    <div style="padding: 8px; border-bottom:1px solid #3b3b3b; background: #242424;">
		<input id="searchInput" type="text" placeholder="Search...." autocomplete="off" style="width: 100%; padding: 8px 10px; border: 1px solid #444; outline: none; background: #181818; color: white;">
	</div>
    <div id="fileList" style="flex: 1; overflow-y: auto; position: relative;">
        <div class="loading">Loading Repository....</div>
    </div>
</div>
<script>
"use strict";
const cfg = {
    downloadProxy : "https://sk3artemis.github.io/DownGit/#/home",
    branch: null,
    cacheResults: true
};
let owner = null;
let repository = null;
let branch = null;
let currentPath = "";
let currentEntries = [];
let selectedEntry = null;
const cache = new Map();
const fileList = document.getElementById("fileList");
const pathIndex = document.getElementById("pathIndex");
const status = document.getElementById("status");
const refreshButton = document.getElementById("refreshButton");
const rootButton = document.getElementById("rootButton");

function findRepo() {
    const hostname = window.location.hostname;
    const pathname = window.location.pathname;
    if (!hostname.endsWith(".github.io")) {
        throw new Error("Could not Find GitHub Repository from this URL");
    }
    owner = hostname.substring(0, hostname.length - ".github.io".length);
    const parts = pathname.split("/").filter(Boolean);
    if (parts.length > 0) {
        repository = parts[0];
    } else {
        repository = owner + ".github.io";
    }
}

async function githubRequest(path) {
    const encodedPath = path.split("/").map(part => encodeURIComponent(part)).join("/");
    let url = `https://api.github.com/repos/` + `${encodeURIComponent(owner)}/` + `${encodeURIComponent(repository)}/` + `contents/${encodedPath}`;
    if (branch) { url += `?ref=${encodeURIComponent(branch)}`; }
    const response = await fetch(url, {
		headers: {"Accept" : "application/vnd.github+json"}
	});
    if (!response.ok) {
        let message;
        try {
            const data = await response.json();
            message = data.message;
        } catch {
            message = response.statusText;
        }
        throw new Error(`GitHub API Error ` + `${response.status}: ${message}`);
    }
    return response.json();
}

async function fetchRepo() {
    const url = `https://api.github.com/repos/` + `${encodeURIComponent(owner)}/` + `${encodeURIComponent(repository)}`;
    const response = await fetch(url, {
		headers: {"Accept" : "application/vnd.github+json"}
	});
    if (!response.ok) { throw new Error(`Repository "${owner}/${repository}" ` + `Not Found`); }
    const data = await response.json();
    if (!branch) { branch = data.default_branch; }
    status.textContent = `${owner}/${repository}/${branch}`;
}

const backButton = document.getElementById("backButton");
async function loadDir(path = "", forceRefresh = false) {
    currentPath = path;
	updateTitle();
    selectedEntry = null;
    fileList.innerHTML = `<div class="loading">Loading....</div>`;
    try {
        const cacheKey = `${branch}:${path}`;
        let entries;
        if (cfg.cacheResults && !forceRefresh && cache.has(cacheKey)) {
            entries = cache.get(cacheKey);
        } else {
            entries = await githubRequest(path);
            if (!Array.isArray(entries)) { entries = [entries]; }
            if (cfg.cacheResults) { cache.set(cacheKey, entries); }
        }
        entries.sort((a, b) => {
            if (a.type === "dir" && b.type !== "dir") { return -1; }
            if (a.type !== "dir" && b.type === "dir") { return 1; }
            return a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: "base"});
        });
        currentEntries = entries;
		if (currentPath === "") {
			entries = entries.filter(entry => entry.name.toLowerCase() !== "index.html");
		}
        renderDirectory(entries);
        renderPathIndex();
        backButton.disabled = currentPath === "";
    } catch (error) {
		fileList.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
        console.error(error);
    }
}

function renderDirectory(entries) {
    fileList.innerHTML = "";
    if (entries.length === 0) { fileList.innerHTML = `<div class="empty">This Folder is Empty</div>`; return; }
    for (const entry of entries) {
        const element = document.createElement("div");
        element.className = "entry";
        element.dataset.path = entry.path;
        const type = entry.type === "dir" ? "Folder" : formatFileSize(entry.size);
		element.innerHTML = `
			<div class="name" title="${escapeHtml(entry.name)}" style=" min-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(entry.name)}</div>
			<div class="type" style="color:#888;font-size:12px;padding-left:20px;white-space:nowrap;">${escapeHtml(type)}</div>
			<button class="download" type="button" style="justify-self:end;border:1px solid #4a4a4a;background:#333;color:#eee;padding:5px 9px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap;">Download</button>
		`;
        const downloadButton = element.querySelector(".download");
        downloadButton.addEventListener("click", event => {
			event.stopPropagation();
			downloadEntry(entry);
		});
        element.addEventListener("dblclick", () => {
			if (entry.type === "dir") { loadDir(entry.path); } else { selectEntry(entry); }
		});
        element.addEventListener("click", () => {
			selectEntry(entry);
		});
        fileList.appendChild(element);
    }
    applySearch();
}

function renderPathIndex() {
    pathIndex.innerHTML = "";
    const root = document.createElement("button");
    root.className = "pathIndex";
    root.textContent = "Root";
    root.addEventListener("click", () => loadDir(""));
    pathIndex.appendChild(root);
    if (!currentPath) { return; }
    const parts = currentPath.split("/").filter(Boolean);
    let accumulated = "";
    parts.forEach(part => {
        const separator = document.createElement("span");
        separator.className = "separator";
        separator.textContent = "›";
        pathIndex.appendChild(separator);
        accumulated += (accumulated ? "/" : "") + part;
        const path = accumulated;
        const button = document.createElement("button");
        button.className = "pathIndex";
        button.textContent = part;
        button.addEventListener("click", () => loadDir(path));
        pathIndex.appendChild(button);
    });
}

function selectEntry(entry) {
    selectedEntry = entry;
    document.querySelectorAll(".entry").forEach(element => {
		element.classList.toggle("selected", element.dataset.path === entry.path);
	});
}

function downloadEntry(entry) {
    if (!entry.html_url) { alert("URL Not Provided"); return; }
    if (entry.type === "file") {
        const rawUrl = "https://github.com/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repository) + "/raw/" + encodeURIComponent(branch) + "/" + entry.path.split("/").map(part => encodeURIComponent(part)).join("/");
        window.open(rawUrl, "_blank", "noopener,noreferrer");
        return;
    }
    const rootDirectory = entry.name;
    const downloadUrl = cfg.downloadProxy + "?url=" + encodeURIComponent(entry.html_url) + "&fileName=" + encodeURIComponent(entry.name) + "&rootDirectory=" + encodeURIComponent(rootDirectory);
    window.open(downloadUrl, "_blank", "noopener,noreferrer");
}

const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", applySearch);
function applySearch() {
    const query = searchInput.value.trim().toLowerCase();
    document.querySelectorAll(".entry").forEach(element => {
		const name = element.querySelector(".name").textContent.toLowerCase();
		element.style.display = !query || name.includes(query) ? "" : "none";
	});
}

backButton.addEventListener("click", () => {
	if (!currentPath) { return; }
	const parts = currentPath.split("/").filter(Boolean);
	parts.pop();
	loadDir(parts.join("/"));
});

refreshButton.addEventListener("click", () => {
	cache.delete(`${branch}:${currentPath}`);
	loadDir(currentPath, true);
});

function formatFileSize(bytes) {
    if (!bytes) { return ""; }
    const units = ["B", "KB", "MB", "GB"];
    let size = bytes;
    let unit = 0;
    while (size >= 1024 && unit < units.length - 1) {
        size /= 1024;
        unit++;
    }
    return (size.toFixed(unit === 0 ? 0 : 1) + " " + units[unit]);
}

function escapeHtml(value) {
    return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function updateTitle() {
    const titleText = document.getElementById("titleText");
    if (!currentPath) { titleText.textContent = "File Index of /"; return; }
    titleText.textContent = `File Index of /${currentPath.replace(/^\/+|\/+$/g, "")}/`;
}

async function initialize() {
    try {
        findRepo();
        status.textContent = `${owner}/${repository}`;
        await fetchRepo();
        await loadDir("");
    } catch (error) {
        fileList.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
        status.textContent = "Error";
        console.error(error);
    }
}
initialize();
</script>
</body>
</html>
